<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Scoreboard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b3261e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dice">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--accent:#b3261e;--ok:#1f7a3d;--line:#e2dfd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171714;--card:#22221e;--text:#f1efe8;--muted:#9a988f;--accent:#ff6b5e;--ok:#5ad17f;--line:#37362f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171714;--card:#22221e;--text:#f1efe8;--muted:#9a988f;--accent:#ff6b5e;--ok:#5ad17f;--line:#37362f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
button{font:inherit;padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button:disabled{opacity:.5}
.banner{font-weight:600;margin-bottom:10px}
.win{color:var(--ok)}
.p{padding:10px 0;border-top:1px solid var(--line)}
.p:first-of-type{border-top:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600}
.tot{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.err{color:var(--accent);font-size:13px;min-height:18px;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<main>
<h1>🎲 Dice Scoreboard</h1>

<div class="card" id="summary"></div>

<div class="card">
  <div class="row">
    <input id="newName" placeholder="Add player name" maxlength="24">
    <button id="addBtn">Add</button>
  </div>
</div>

<div class="card" id="players"></div>

<div class="row">
  <button class="ghost" id="undoBtn">Undo last</button>
  <button class="ghost" id="resetBtn">New game</button>
</div>
<div class="err" id="err"></div>
</main>

<script>
const GOAL = 10000;
const MIN_START = 650;
let state = { players: [], log: [] }; // players: {id,name,total}; log: {id,pts}

try { const s = localStorage.getItem('dice-scoreboard'); if (s) state = JSON.parse(s); } catch (e) {}
function save(){ try { localStorage.setItem('dice-scoreboard', JSON.stringify(state)); } catch (e) {} }

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setErr(m){ $('err').textContent = m || ''; }

function addPlayer(){
  const name = $('newName').value.trim();
  if (!name) return;
  state.players.push({ id: Date.now() + Math.random(), name, total: 0 });
  $('newName').value = '';
  setErr(); save(); render();
}

function addScore(id){
  const inp = document.querySelector('[data-in="' + id + '"]');
  const pts = parseInt(inp.value, 10);
  if (isNaN(pts)) return;
  const p = state.players.find(x => x.id === id);
  if (state.players.some(x => x.total === GOAL)) { setErr('Game over — start a new game.'); return; }
  if (p.total + pts > GOAL) { setErr(p.name + ' can\u2019t go over ' + fmt(GOAL) + ' (needs ' + fmt(GOAL - p.total) + ' or less).'); return; }
  if (p.total + pts < 0) { setErr('Score can\u2019t go below 0.'); return; }
  if (p.total === 0 && pts < MIN_START) {
    state.log.push({ id, pts: 0 });
    save(); render();
    setErr(p.name + ' scored ' + fmt(pts) + ', recorded as 0 (needs ' + fmt(MIN_START) + '+ to get on the board).');
    return;
  }
  p.total += pts;
  state.log.push({ id, pts });
  setErr(); save(); render();
}

function undo(){
  const last = state.log.pop();
  if (!last) return;
  const p = state.players.find(x => x.id === last.id);
  if (p) p.total -= last.pts;
  setErr(); save(); render();
}

function removePlayer(id){
  state.players = state.players.filter(p => p.id !== id);
  state.log = state.log.filter(l => l.id !== id);
  save(); render();
}

function reset(){
  if (!confirm('Start a new game? Scores will be cleared (players stay).')) return;
  state.players.forEach(p => p.total = 0);
  state.log = [];
  setErr(); save(); render();
}

function render(){
  const ranked = [...state.players].sort((a, b) => b.total - a.total);
  const winner = ranked.find(p => p.total === GOAL);
  let html;
  if (!ranked.length) {
    html = '<div class="sub">Add players to start. First to exactly ' + fmt(GOAL) + ' wins.</div>';
  } else if (winner) {
    html = '<div class="banner win">🏆 ' + esc(winner.name) + ' wins with ' + fmt(GOAL) + '!</div>';
  } else {
    const lead = ranked[0];
    html = '<div class="banner">Leader: ' + esc(lead.name) + ' — ' + fmt(lead.total) + '</div>' +
           '<div class="sub">Closest to ' + fmt(GOAL) + ': ' + esc(lead.name) + ' (' + fmt(GOAL - lead.total) + ' to go)</div>';
  }
  if (ranked.length) {
    html += '<div style="margin-top:10px">' + ranked.map((p, i) =>
      '<div class="top"><span>' + (i + 1) + '. ' + esc(p.name) + '</span><span class="tot">' + fmt(p.total) + '</span></div>'
    ).join('') + '</div>';
  }
  $('summary').innerHTML = html;

  $('players').innerHTML = state.players.length ? state.players.map(p =>
    '<div class="p"><div class="top"><span class="name">' + esc(p.name) +
    (p.total === GOAL ? '<span class="tag">winner</span>' : '') +
    '</span><span class="tot">' + fmt(p.total) + '</span></div>' +
    '<div class="bar"><i style="width:' + (p.total / GOAL * 100) + '%"></i></div>' +
    '<div class="row"><input type="number" inputmode="numeric" step="50" placeholder="Score this turn" data-in="' + p.id + '">' +
    '<button data-add="' + p.id + '">Add</button>' +
    '<button class="ghost" data-del="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">✕</button></div>' +
    '<div class="sub" style="margin-top:4px">' + (p.total === 0 ? 'Needs ' + fmt(MIN_START) + '+ to get on the board' : fmt(GOAL - p.total) + ' to go') + '</div></div>'
  ).join('') : '<div class="sub">No players yet.</div>';

  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addScore(+b.dataset.add));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removePlayer(+b.dataset.del));
  document.querySelectorAll('[data-in]').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') addScore(+i.dataset.in); });
  $('undoBtn').disabled = !state.log.length;
}

$('addBtn').onclick = addPlayer;
$('newName').onkeydown = e => { if (e.key === 'Enter') addPlayer(); };
$('undoBtn').onclick = undo;
$('resetBtn').onclick = reset;
render();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
